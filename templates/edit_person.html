{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>Edit Person</h1><p class="muted">{{ person.village.name }} · Serial No. {{ person.serial_no }}</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name</label><input name="name" value="{{ person.name }}" required><label>Father's Name</label><input name="father_name" value="{{ person.father_name }}" required><label>Address</label><textarea name="address" required>{{ person.address }}</textarea><label>Gender</label><select name="gender">{% for g in ['Male','Female','Other'] %}<option {% if person.gender==g %}selected{% endif %}>{{ g }}</option>{% endfor %}</select><button class="btn primary full">Save Changes</button> <a class="btn full" href="{{ url_for('dashboard') }}">Cancel</a></form></section>{% endblock %}
