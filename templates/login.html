{% extends 'base.html' %}{% block content %}
<section class="panel narrow"><h1>Admin Login</h1><p class="muted">Sign in to manage villages and records.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username</label><input name="username" required autocomplete="username">
<label>Password</label><input type="password" name="password" required autocomplete="current-password">
<button class="btn primary full">Login</button></form></section>{% endblock %}
