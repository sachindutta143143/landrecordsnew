<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or 'Village People Management' }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header><div class="brand">VILLAGE PEOPLE MANAGEMENT</div></header>
<main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }} {% if category=='link' %}<button class="btn small" type="button" onclick="navigator.clipboard.writeText(this.parentElement.textContent.replace('Copy','').trim())">Copy</button>{% endif %}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Private village records · Authorized access only</footer></body></html>
